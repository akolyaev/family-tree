<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{layout/_header}"></div>

<div class="container mt-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="text-center mb-4">Редактирование</h2>

            <form th:action="@{/persons/{id}/edit(id=${person.id})}" th:object="${request}" method="post">
                <!-- firstName (read-only) -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Имя</label>
                    <span class="form-control-plaintext" th:text="${person.firstName}"></span>
                </div>

                <!-- lastName (read-only) -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Фамилия</label>
                    <span class="form-control-plaintext" th:text="${person.lastName}"></span>
                </div>

                <!-- birthDate (read-only) -->
                <div class="mb-3">
                    <label class="form-label fw-bold">Дата рождения</label>
                    <span class="form-control-plaintext" th:text="${person.birthDate != null ? person.birthDate.toString() : ''}"></span>
                </div>

                <!-- bio (editable) -->
                <div class="mb-3">
                    <label for="bio" class="form-label fw-bold">Биография</label>
                    <textarea class="form-control" id="bio" name="bio" th:text="${request.bio}" rows="3"></textarea>
                </div>

                <!-- Submit -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>

            <!-- Back to person page -->
            <div class="mt-3 text-center">
                <a th:href="@{/persons/{id}(id=${person.id})}" class="btn btn-link">Отмена</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/_footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
