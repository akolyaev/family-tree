spring.application.name=family-tree

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/familytree}
spring.datasource.username=${DATABASE_USERNAME:familyuser}
spring.datasource.password=${DATABASE_PASSWORD:familysecret}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

flyway.enabled=true
flyway.locations=classpath:db/migration

server.port=8080

# Security users
admin.username=admin
admin.password=password
admin.roles=USER,MASTER
user.username=user
user.password=password
user.roles=USER
