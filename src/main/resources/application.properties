spring.application.name=family-tree

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:familytree}
spring.datasource.username=${DB_USERNAME:familyuser}
spring.datasource.password=${DB_PASSWORD:familysecret}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

flyway.enabled=true
flyway.locations=classpath:db/migration

server.port=8080

# Security users
admin.username=admin
admin.password=password
admin.roles=USER,MASTER
user.username=user
user.password=password
user.roles=USER
